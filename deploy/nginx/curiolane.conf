# Host Nginx: reverse proxy in front of the Docker containers.
# Certbot adds the HTTPS (443) part to this file on its own.
server {
    listen 80;
    listen [::]:80;
    server_name curiolane.giuseppecorso.it;

    # REST API and Swagger -> Spring Boot
    location ~ ^/(api/|swagger-ui|v3/api-docs) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # everything else -> Angular
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
